experiment:
  name: exp00b
  motivation: Run GLM-5.2 through CaP-X on ten RoboTwin tasks and verify frontend ingestion
  parent: exp00a

protocol:
  model: glm-5.2
  server_url: http://127.0.0.1:8110/chat/completions
  upstream_url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
  reasoning_effort: max
  max_tokens: 4096
  temperature: 1.0
  trials_per_task: 1
  num_workers: 1
  record_video: true
  use_oracle_code: false

scope:
  libero_suites:
    - libero_spatial
    - libero_object
    - libero_goal
    - libero_10
    - libero_90
  expected_libero_tasks: 130
  expected_robotwin_tasks: 50
  selected_robotwin_tasks:
    - adjust_bottle
    - beat_block_hammer
    - blocks_ranking_rgb
    - blocks_ranking_size
    - click_alarmclock
    - click_bell
    - dump_bin_bigbin
    - grab_roller
    - handover_block
    - handover_mic

runtime:
  host: xdlab23_yang
  remote_root: /data1/ybyang/robotwin-capx/cap-x-dual
  robotwin_root: /data1/ybyang/robotwin-capx/RoboTwin
  robotwin_python: /data1/ybyang/envs/robotwin-capx/bin/python
  libero_python: /data1/ybyang/envs/capx-libero/bin/python
  robot_descriptions_cache: /data1/ybyang/robotwin-capx/robot-descriptions
  robot_description_commit: 3fed73700f2201906eb67c5c922d0f476c667c00
  gpu: 6

outputs:
  root: outputs/exp00b
  ledger: exp/exp00b/results/ledger.jsonl
  task_manifest: exp/exp00b/results/task_manifest.json
  manifest: exp/exp00b/results/manifest.json
  summary: exp/exp00b/results/summary.md
  analyze_script: exp/exp00b/analyze.py
