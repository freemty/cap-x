<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CaP-X Benchmark Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">CaP-X</p>
        <h1>Benchmark Results</h1>
      </div>
      <div class="connection" aria-live="polite">
        <span id="connection-dot" class="connection-dot"></span>
        <span id="connection-text">Connecting</span>
      </div>
    </header>

    <main>
      <section aria-labelledby="overview-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Overview</p>
            <h2 id="overview-heading">RobotTwin / LIBERO</h2>
          </div>
          <p id="updated-at" class="muted">Not loaded</p>
        </div>
        <div id="benchmark-cards" class="benchmark-grid" aria-live="polite"></div>
      </section>

      <section aria-labelledby="runs-heading">
        <div class="section-heading runs-heading">
          <div>
            <p class="eyebrow">Runs</p>
            <h2 id="runs-heading">History</h2>
          </div>
          <div class="filters" aria-label="Run filters">
            <label>
              <span>Benchmark</span>
              <select id="benchmark-filter">
                <option value="">All</option>
                <option value="robotwin">RobotTwin</option>
                <option value="libero">LIBERO</option>
              </select>
            </label>
            <label>
              <span>Status</span>
              <select id="status-filter">
                <option value="">All</option>
                <option value="running">Running</option>
                <option value="complete">Complete</option>
                <option value="failed">Failed</option>
              </select>
            </label>
            <label>
              <span>Task</span>
              <input id="task-filter" type="search" placeholder="Filter task">
            </label>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Run</th>
                <th>Benchmark</th>
                <th>Task</th>
                <th>Policy</th>
                <th>Status</th>
                <th>Code</th>
                <th>Plan</th>
                <th>Task</th>
                <th>Reward</th>
              </tr>
            </thead>
            <tbody id="run-rows"></tbody>
          </table>
          <p id="empty-runs" class="empty" hidden>No runs match these filters.</p>
        </div>
      </section>
    </main>

    <aside id="detail-panel" class="detail-panel" aria-labelledby="detail-title" aria-hidden="true">
      <div class="detail-header">
        <div>
          <p id="detail-benchmark" class="eyebrow"></p>
          <h2 id="detail-title">Run details</h2>
          <p id="detail-meta" class="muted"></p>
        </div>
        <button id="detail-close" class="button secondary" type="button">Close</button>
      </div>
      <div id="detail-body" class="detail-body"></div>
    </aside>
    <div id="panel-scrim" class="panel-scrim" hidden></div>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
